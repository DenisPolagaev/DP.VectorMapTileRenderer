name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore DP.VectorMapTileRenderer.slnx

      - name: Build
        run: dotnet build DP.VectorMapTileRenderer.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DP.VectorMapTileRenderer.slnx -c Release --no-build
