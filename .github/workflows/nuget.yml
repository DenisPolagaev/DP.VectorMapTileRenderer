name: nuget

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (for example 1.0.1). Defaults to the tag or a CI version."
        required: false
        type: string
      publish:
        description: "Publish the built packages to NuGet.org"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NUGET_USER: ${{ secrets.NUGET_USER }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

  test:
    name: test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8-10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Test
        run: dotnet test DP.VectorMapTileRenderer.slnx -c Release

  pack:
    name: pack ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            project: src/DP.VectorMapTileRenderer/DP.VectorMapTileRenderer.csproj
          - name: skia
            project: src/DP.VectorMapTileRenderer.Skia/DP.VectorMapTileRenderer.Skia.csproj
          - name: pmtiles
            project: src/DP.VectorMapTileRenderer.Pmtiles/DP.VectorMapTileRenderer.Pmtiles.csproj
          - name: mbtiles
            project: src/DP.VectorMapTileRenderer.MbTiles/DP.VectorMapTileRenderer.MbTiles.csproj
          - name: geojson
            project: src/DP.VectorMapTileRenderer.GeoJson/DP.VectorMapTileRenderer.GeoJson.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8-10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore "${{ matrix.project }}"

      - name: Pack
        run: >
          dotnet pack "${{ matrix.project }}"
          -c Release
          --no-restore
          -o artifacts/packages
          -p:Version=${{ needs.version.outputs.version }}
          -p:PackageVersion=${{ needs.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ matrix.name }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: [test, pack]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nuget-*
          path: artifacts/packages
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: List packages
        run: ls -lah artifacts/packages

      - name: NuGet login (OIDC → temporary API key)
        id: login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to NuGet.org
        if: env.NUGET_USER != ''
        shell: bash
        run: |
          shopt -s nullglob
          for package in artifacts/packages/*.nupkg; do
            echo "Pushing $package"
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          for symbols in artifacts/packages/*.snupkg; do
            echo "Pushing symbols $symbols"
            dotnet nuget push "$symbols" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
